name: refresh-catalog
# 전체 파이프라인 1-shot(수확→정제→보강→검수→색인→빌드) 수동 폴백.
# ⚠️ 정기 자동실행은 이제 brain.yml(🧠 자율 신경계, 2h마다)가 담당한다.
#    이중 스케줄 충돌을 막기 위해 이 워크플로의 cron은 제거하고 수동 실행만 남긴다.
on:
  workflow_dispatch:          # 수동 실행 버튼(전체 파이프라인을 한 번에 돌리고 싶을 때)

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 전체 파이프라인 (수확→정제→중복정리→보강→검수→색인→빌드)
        run: node tools/pipeline.js --pages=${{ github.event.schedule == '0 20 * * 1' && '30' || '8' }} --aladin-limit=1500
        # 알라딘 일 5,000 한도 → 회당 1,500(하루 2회=3,000, 월요일 +주간 1회=4,500 < 5,000)
        env:
          ALADIN_TTBKEY: ${{ secrets.ALADIN_TTBKEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: KOBIC 신간·표지 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi

  # GitHub Pages 배포 (index.html을 https로 공유)
  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # ⚠️ github-pages 환경 배포는 pages.yml·brain.yml deploy-pc와 반드시 같은 concurrency
    #   그룹(pages)으로 직렬화해야 함. 워크플로레벨 concurrency는 group:refresh-catalog가
    #   점유하므로 여기선 잡레벨로 지정. 없으면 수동 실행 시 세 경로가 동시 배포→
    #   'in progress deployment' 400 실패→소유자 이메일 알림. cancel-in-progress:false는 Pages 공식 권장.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'        # repo 루트(index.html + covers/)를 그대로 배포
      - id: deployment
        uses: actions/deploy-pages@v4
